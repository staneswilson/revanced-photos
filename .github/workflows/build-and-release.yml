name: build-and-release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no version change'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android build-tools
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install apkeep
        run: |
          APKEEP_VERSION="0.17.0"
          APKEEP_SHA256="61f6b4138e381f4fd8e05e386db13760c7fbcc8ceaa2c366c1ad9c6de4e6b6ab"
          curl -fsSL -o apkeep "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          echo "${APKEEP_SHA256}  apkeep" | sha256sum -c - || exit 1
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep

      - name: Install APKEditor (for merging XAPK split bundles)
        run: |
          APKEDITOR_VERSION="1.4.8"
          APKEDITOR_SHA256="026906af28497577496a3e1f5054a878a7cf9c1b3889626882d87ea88d09c20f"
          curl -fsSL -o APKEditor.jar "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar"
          echo "${APKEDITOR_SHA256}  APKEditor.jar" | sha256sum -c - || exit 1
          sudo mv APKEditor.jar /usr/local/lib/APKEditor.jar
          echo "APKEDITOR_JAR=/usr/local/lib/APKEditor.jar" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Fetch Google Photos APK
        run: |
          mkdir -p input
          node -e "
          import('./dist/core/apkFetcher.js').then(m => m.fetchGPhotosApk('input/photos.apk')).then(res => {
            const fs = require('fs');
            fs.writeFileSync('input/metadata.json', JSON.stringify(res, null, 2));
            fs.writeFileSync('input/version.txt', res.version);
            console.log('Successfully fetched Google Photos version:', res.version, 'via', res.source);
          });"

      - name: Run Morphe pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: node build.mjs --input input/photos.apk

      - name: Read Release Metadata
        id: meta
        run: |
          node -e "
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('output/release-meta.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + meta.releaseTag + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + meta.releaseTitle + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + meta.version + '\n');
          console.log('Release Tag   :', meta.releaseTag);
          console.log('Release Title :', meta.releaseTitle);
          console.log('App Version   :', meta.version);
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-photos-${{ steps.meta.outputs.version || github.run_number }}
          path: |
            output/*.apk
            output/*.zip
            export-profile.json
            output/release-meta.json
            output/release-notes.md
          retention-days: 7

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.title }}
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: output/release-notes.md
          files: |
            output/GooglePhotos-v${{ steps.meta.outputs.version }}-PixelXL-unlimited.apk
            output/com.google.android.apps.photos-morphe-signed.apk
            output/GooglePhotos-v${{ steps.meta.outputs.version }}-Magisk-module.zip
            output/magisk-revanced-gphotos.zip
            export-profile.json
            output/release-meta.json
          fail_on_unmatched_files: false
