name: build-and-release

on:
  schedule:
    - cron: '0 2 * * 0'     # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no version change'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android build-tools
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install apkeep
        run: |
          APKEEP_VERSION="0.17.0"
          APKEEP_SHA256="61f6b4138e381f4fd8e05e386db13760c7fbcc8ceaa2c366c1ad9c6de4e6b6ab"
          curl -fsSL -o apkeep "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          echo "${APKEEP_SHA256}  apkeep" | sha256sum -c - || exit 1
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Run ReVanced pipeline
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASS:  ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS:        ${{ secrets.KEY_PASS }}
        run: node dist/index.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revanced-gphotos-${{ github.run_number }}
          path: |
            workspace/output-signed.apk
            workspace/magisk-revanced-gphotos.zip
          retention-days: 7

      - name: Read release metadata
        id: meta
        run: |
          TAG=$(node -e "import('./workspace/meta.json', {assert:{type:'json'}}).then(m => console.log(m.default.releaseTag))")
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: workspace/release-notes.md
          files: |
            workspace/output-signed.apk
            workspace/magisk-revanced-gphotos.zip
          fail_on_unmatched_files: true
