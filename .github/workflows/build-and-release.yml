name: build-and-release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no version change'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android build-tools
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install apkeep
        run: |
          APKEEP_VERSION="0.17.0"
          APKEEP_SHA256="61f6b4138e381f4fd8e05e386db13760c7fbcc8ceaa2c366c1ad9c6de4e6b6ab"
          curl -fsSL -o apkeep "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          echo "${APKEEP_SHA256}  apkeep" | sha256sum -c - || exit 1
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep

      - name: Install APKEditor (for merging XAPK split bundles)
        run: |
          APKEDITOR_VERSION="1.4.8"
          APKEDITOR_SHA256="026906af28497577496a3e1f5054a878a7cf9c1b3889626882d87ea88d09c20f"
          curl -fsSL -o APKEditor.jar "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar"
          echo "${APKEDITOR_SHA256}  APKEditor.jar" | sha256sum -c - || exit 1
          sudo mv APKEditor.jar /usr/local/lib/APKEditor.jar
          echo "APKEDITOR_JAR=/usr/local/lib/APKEditor.jar" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Fetch Google Photos APK
        run: |
          mkdir -p input
          node -e "import('./dist/core/apkFetcher.js').then(m => m.fetchGPhotosApk('input/photos.apk')).then(res => console.log('Successfully fetched Google Photos', res.version));"

      - name: Run Morphe pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: node build.mjs --input input/photos.apk

      - name: Generate Release Metadata
        id: meta
        run: |
          node -e "
          const fs = require('fs');
          const apk = fs.readdirSync('input').find(f => f.endsWith('.apk'));
          const version = apk ? apk.replace(/[^0-9.]/g, '').replace(/^\.+|\.+$/g, '') : 'latest';
          const tag = 'v' + version + '-morphe';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          const notes = [
            '## Google Photos Morphe Release',
            '',
            '* **Target Application:** Google Photos (\`com.google.android.apps.photos\`)',
            '* **Device Spoof Target:** Google Pixel XL (\`marlin\`)',
            '* **Patching Framework:** Morphe Desktop CLI & Morphe Patches (\`.mpp\`)',
            '* **Signer & Alignment:** 4-Byte ZipAlign & v1/v2/v3 Cryptographic Signing (\`uber-apk-signer\`)',
            '* **Key Features:**',
            '  - 🌟 **Lifetime Unlimited Original-Quality Cloud Backup** (Zero Google One storage quota charge)',
            '  - 🛡️ **MicroG / GmsCore Authentication Support** (\`app.revanced.android.gms\`)',
            '  - ⚡ **Cold Start Account Persistence Fix**',
            '',
            '### Installation Guide',
            '1. Install [MicroG / GmsCore](https://github.com/ReVanced/GmsCore/releases) and sign into your Google Account.',
            '2. Install \`com.google.android.apps.photos-morphe-signed.apk\`.',
            '3. Set **Battery Optimization** for both GmsCore and Google Photos to **Unrestricted**.',
            '4. Open Google Photos and confirm: **\"This Pixel can back up unlimited photos & videos at no charge.\"**'
          ].join('\n');
          fs.writeFileSync('release-notes.md', notes);
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morphe-gphotos-${{ github.run_number }}
          path: |
            output/com.google.android.apps.photos-morphe-signed.apk
            export-profile.json
          retention-days: 7

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: |
            output/com.google.android.apps.photos-morphe-signed.apk
            export-profile.json
          fail_on_unmatched_files: true
